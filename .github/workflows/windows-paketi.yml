name: Windows paketi

# "v1.2.0" gibi bir etiket gönderildiğinde: paketi üretir, gerçek Windows'ta dener ve
# GitHub "Releases" sayfasına yükler. Actions sekmesinden elle de çalıştırılabilir (yayınlamadan).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketi üret
        run: |
          python -m pip install pillow
          python dev/build_windows_package.py --download --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-paketi
          path: dist/WhatsApp-Arsivi-Windows.zip

  windows-deneme:
    needs: paket
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: windows-paketi
          path: dist
      - name: Paketi aç ve sahte yedekle dene
        shell: pwsh
        env:
          FAKE_BUYUK: "0"
        run: |
          python -m pip install pillow
          Expand-Archive dist/WhatsApp-Arsivi-Windows.zip -DestinationPath paket
          python dev/make_fake_backup.py "$env:RUNNER_TEMP\yedek"
          & "paket\WhatsApp Arsivi\runtime\python.exe" dev\smoke_package.py "paket\WhatsApp Arsivi" "$env:RUNNER_TEMP\yedek\00008110-001A2B3C4D5E6F70"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  yayinla:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-deneme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-paketi
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/WhatsApp-Arsivi-Windows.zip
          generate_release_notes: true
          body: |
            **İndirme:** Aşağıdaki `WhatsApp-Arsivi-Windows.zip` dosyasını indirin, sağ tıklayıp **Tümünü ayıkla** deyin
            ve `WhatsApp Arsivi.exe`'yi açın. Kurulum gerekmez. iPhone yedeğinin nasıl alınacağı [README](${{ github.server_url }}/${{ github.repository }}#readme)'de.

            **Download:** Get `WhatsApp-Arsivi-Windows.zip` below, right-click it, choose **Extract All** and open
            `WhatsApp Arsivi.exe`. No installation needed. How to make the iPhone backup: [README (English)](${{ github.server_url }}/${{ github.repository }}/blob/main/README.en.md).
